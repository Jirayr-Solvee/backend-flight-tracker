[Service]
# Bounded cleanup is a pre-start gate; a backlog/failure must be investigated
# before the API starts serving traffic. No provider or credential is accessed.
ExecStartPre=/usr/bin/env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 /home/ubuntu/backend-flight-tracker/venv/bin/python3 /home/ubuntu/backend-flight-tracker/scripts/cleanup_search_failures.py --database /home/ubuntu/backend-flight-tracker/database.db --apply --batch-size 500 --max-batches 40 --deadline-seconds 20
